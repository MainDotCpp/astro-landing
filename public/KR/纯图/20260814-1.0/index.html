<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>새 메시지</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  background: linear-gradient(135deg, #1a0a12, #2d0a1e, #0d0610);
}

.wrap {
  position: relative;
  width: 100%; max-width: 560px; height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
}

.bg {
  position: absolute; inset: 0;
  background: url('./bg.png') center top / cover no-repeat;
  z-index: 0;
}

.overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,0) 40%,
    rgba(20,0,10,0.4) 65%,
    rgba(20,0,10,0.92) 100%
  );
  z-index: 1;
}

/* top notification bar */
.noti-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 3;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  animation: slideDown 0.5s ease-out;
}

@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.noti-icon {
  width: 36px; height: 36px;
  background: #fee500;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.noti-icon svg { width: 20px; height: 20px; }

.noti-text {
  flex: 1;
  min-width: 0;
}

.noti-app {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 2px;
}

.noti-preview {
  font-size: 14px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.noti-time {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  flex-shrink: 0;
}

.content {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 2;
  padding: 0 20px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* chat bubbles */
.chat {
  width: 100%;
  max-width: 380px;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.chat-name {
  font-size: 13px;
  color: rgba(255,180,200,0.75);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 2px;
}

.online-dot {
  width: 7px; height: 7px;
  background: #4ade80;
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(74,222,128,0.7);
  animation: blink 2s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.bubble {
  background: rgba(255,255,255,0.13);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,120,160,0.2);
  border-radius: 4px 18px 18px 18px;
  padding: 12px 16px;
  font-size: 15px;
  color: #fff;
  line-height: 1.6;
  word-break: keep-all;
  align-self: flex-start;
  max-width: 85%;
  animation: fadeUp 0.4s ease-out both;
}

.bubble:nth-child(3) { animation-delay: 0.6s; }
.bubble:nth-child(4) { animation-delay: 1.2s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.bubble em {
  font-style: normal;
  color: #ff6b9d;
}

.bubble-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  align-self: flex-start;
}

.bubble-time {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  flex-shrink: 0;
  padding-bottom: 2px;
}

.unread {
  font-size: 11px;
  color: #fee500;
  flex-shrink: 0;
  padding-bottom: 2px;
}

/* typing indicator */
.typing {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px 16px 16px 16px;
  align-self: flex-start;
  animation: fadeUp 0.3s ease-out 1.8s both;
}

.typing-dot {
  width: 6px; height: 6px;
  background: rgba(255,255,255,0.5);
  border-radius: 50%;
  animation: typingBounce 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

.cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  max-width: 340px;
  padding: 15px 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff4081, #e91e63);
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
  border: none;
  cursor: pointer;
  animation: pulse 2s ease-in-out infinite;
  letter-spacing: -0.3px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

.cta svg {
  width: 22px; height: 22px;
  flex-shrink: 0;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 4px 24px rgba(255,64,129,0.4); }
  50% { transform: scale(1.03); box-shadow: 0 6px 36px rgba(255,64,129,0.65); }
}

.bottom-note {
  margin-top: 10px;
  font-size: 11px;
  color: rgba(255,180,200,0.3);
}

@media (min-width: 768px) {
  .content { padding-bottom: 48px; }
  .bubble { font-size: 16px; }
  .cta { max-width: 360px; font-size: 18px; padding: 18px 0; }
}
</style>
</head>
<body>
<!-- top: fake kakao notification -->

    <a class="cta" href="javascript:void(0)" onclick="onLinkBtnClick()">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>

  </div>
</div>
