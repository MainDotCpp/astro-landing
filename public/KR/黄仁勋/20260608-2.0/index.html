    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #0c0a1a;
            font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: #e0e0e0;
            padding-bottom: 84px;
        }

        .hero {
            position: relative;
            background: linear-gradient(135deg, #1a0a3e 0%, #0d1b42 50%, #0a1a30 100%);
            padding: 36px 20px 28px;
            text-align: center;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%; left: -20%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(139,92,246,0.1) 0%, transparent 65%);
            border-radius: 50%;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%; right: -15%;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 65%);
            border-radius: 50%;
        }

        .avatar {
            width: 108px; height: 108px;
            border-radius: 50%;
            border: 3px solid rgba(139,92,246,0.5);
            object-fit: cover;
            margin: 0 auto 14px;
            display: block;
            box-shadow: 0 0 30px rgba(139,92,246,0.2), 0 0 60px rgba(6,182,212,0.1);
        }

        .hero h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 4px;
        }
        .hero .subtitle {
            color: rgba(6,182,212,0.9);
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.08em;
        }

        .content { max-width: 480px; margin: 0 auto; padding: 0 16px; }

        .card {
            background: linear-gradient(135deg, rgba(139,92,246,0.06) 0%, rgba(6,182,212,0.04) 100%);
            border: 1px solid rgba(139,92,246,0.12);
            margin: -12px 16px 0;
            border-radius: 14px;
            padding: 22px 18px;
            position: relative;
            z-index: 1;
        }
        .card p {
            font-size: 0.94rem;
            line-height: 1.85;
            color: #bbb;
        }

        .banner-wrap {
            margin: 18px 16px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 28px rgba(139,92,246,0.15);
            cursor: pointer;
            border: 1px solid rgba(139,92,246,0.15);
        }
        .banner-wrap img { width: 100%; height: auto; display: block; }

        .pitch {
            background: linear-gradient(135deg, rgba(6,182,212,0.04) 0%, rgba(139,92,246,0.06) 100%);
            border: 1px solid rgba(6,182,212,0.1);
            margin: 0 16px 18px;
            border-radius: 14px;
            padding: 22px 18px;
        }
        .pitch p {
            font-size: 0.94rem;
            line-height: 1.85;
            color: #bbb;
        }

        .cta-inline {
            display: block;
            width: calc(100% - 32px);
            margin: 0 16px 22px;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 0.04em;
            box-shadow: 0 4px 20px rgba(139,92,246,0.3);
        }

        .sticky-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(12,10,26,0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(139,92,246,0.2);
            padding: 12px 16px;
            text-align: center;
        }
        .sticky-bar button {
            width: 100%; max-width: 440px;
            padding: 13px;
            background: #06C755;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .sticky-bar .line-icon { width: 22px; height: 22px; }

        @media (min-width: 520px) {
            .card, .pitch { margin-left: auto; margin-right: auto; max-width: 480px; }
            .banner-wrap { margin-left: auto; margin-right: auto; max-width: 480px; }
            .cta-inline { max-width: 480px; margin-left: auto; margin-right: auto; }
        }
    </style>
</head>
