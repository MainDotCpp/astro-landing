    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #fff;
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif;
            color: #333;
            padding-bottom: 76px;
        }

        .top-bar {
            background: #b22222;
            text-align: center;
            padding: 10px 12px;
            color: #ffe066;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.15em;
        }

        .profile {
            text-align: center;
            padding: 28px 16px 20px;
            background: linear-gradient(180deg, #fffaf0 0%, #fff 100%);
            border-bottom: 3px solid #d4a528;
        }
        .profile img {
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 3px solid #d4a528;
            object-fit: cover;
            display: block;
            margin: 0 auto 12px;
        }
        .profile h1 {
            font-size: 1.7rem;
            color: #b22222;
            font-weight: 900;
        }
        .profile .tag {
            display: inline-block;
            margin-top: 6px;
            background: #b22222;
            color: #ffe066;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 3px 14px;
            border-radius: 3px;
            letter-spacing: 0.12em;
        }

        .body-text {
            padding: 22px 18px;
            font-size: 1.08rem;
            line-height: 2;
            color: #444;
            max-width: 520px;
            margin: 0 auto;
        }

        .banner-link {
            display: block;
            margin: 0 12px 18px;
            max-width: 520px;
            cursor: pointer;
        }
        .banner-link img {
            width: 100%;
            height: auto;
            display: block;
            border: 2px solid #d4a528;
            border-radius: 6px;
        }

        .big-cta {
            display: block;
            width: calc(100% - 24px);
            max-width: 520px;
            margin: 8px auto 24px;
            padding: 16px;
            background: #06C755;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 900;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.06em;
        }

        .divider {
            border: none;
            border-top: 2px dashed #e0d5c0;
            margin: 0 18px;
            max-width: 520px;
        }

        .sticky-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
            background: #b22222;
            padding: 12px 14px;
            text-align: center;
        }
        .sticky-bottom button {
            width: 100%;
            max-width: 480px;
            padding: 14px;
            background: #06C755;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 900;
            border: 2px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.06em;
        }

        @media (min-width: 540px) {
            .banner-link { margin-left: auto; margin-right: auto; }
        }
    </style>
</head>
