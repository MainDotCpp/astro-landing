<!-- מתחת לשדה הטלפון -->
<div id="phone-error">מספר טלפון לא תקין. יש להזין 10 ספרות עם קידומת חוקית.</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const phoneNumberInput = document.getElementById('form-field-phone');
  const errorMessage = document.getElementById('phone-error');

  if (!phoneNumberInput) return;

  // עיצוב ראשוני לאחר אוטופיל
  setTimeout(() => formatPhoneNumber(), 100);

  // עיצוב בלבד (לא מציג שגיאה)
  phoneNumberInput.addEventListener('input', formatPhoneNumber);
  phoneNumberInput.addEventListener('change', formatPhoneNumber);
  phoneNumberInput.addEventListener('blur', formatPhoneNumber);

  // מאזין לשליחה
  document.addEventListener('submit', function (e) {
    const form = e.target;
    if (!form.contains(phoneNumberInput)) return;

    const raw = getRawPhoneNumber();
    const isValid = isValidPhoneNumber(raw);

    if (!isValid) {
      e.preventDefault();
      e.stopImmediatePropagation();
      phoneNumberInput.classList.add('invalid');
      errorMessage.style.display = 'block'; // מציג שגיאה רק כעת
    } else {
      phoneNumberInput.classList.remove('invalid');
      errorMessage.style.display = 'none';
    }
  }, true);

  function formatPhoneNumber() {
    let inputValue = phoneNumberInput.value;

    inputValue = inputValue.replace(/^0972|^972/, '');
    inputValue = inputValue.replace(/\D/g, '');

    if (inputValue.length > 10) {
      inputValue = inputValue.slice(0, 10);
    }

    let formatted = '';
    if (inputValue.length > 6) {
      formatted = `${inputValue.slice(0, 3)}-${inputValue.slice(3, 6)}-${inputValue.slice(6, 10)}`;
    } else if (inputValue.length > 3) {
      formatted = `${inputValue.slice(0, 3)}-${inputValue.slice(3)}`;
    } else {
      formatted = inputValue;
    }

    phoneNumberInput.value = formatted;

    const raw = inputValue.replace(/\D/g, '');
    const isValid = isValidPhoneNumber(raw);

    // רק עיצוב השדה – לא מציג שגיאה
    if (isValid) {
      phoneNumberInput.classList.remove('invalid');
    } else {
      phoneNumberInput.classList.add('invalid');
    }
  }

  function getRawPhoneNumber() {
    let value = phoneNumberInput.value || '';
    value = value.replace(/^0972|^972/, '');
    return value.replace(/\D/g, '');
  }

  function isValidPhoneNumber(raw) {
    if (raw.length !== 10) return false;

    const validPrefixes = [
      '050','051','052','053','054','055','056','057','058','059',
      '02','03','04','08','09',
      '072','073','074','075','076','077'
    ];

    return validPrefixes.some(prefix => raw.startsWith(prefix));
  }
});
</script>
