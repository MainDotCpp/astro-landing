<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="5;url=https://youtube.com" />
    <title>Page Not Found</title>
    <meta name="description" content="Sorry, the page you are looking for does not exist" />
    <link rel="icon" type="image/svg+xml" href="/mjSFqQ/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200;300;400;500&family=Noto+Sans+SC:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Noto Sans JP', 'Noto Sans SC', 'sans-serif'],
            },
            animation: {
              fadeIn: 'fadeIn 0.8s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          },
        },
      }
    </script>
    <style>
      body {
        background: #f8fafc;
      }
    </style>
  </head>
  <body class="font-sans min-h-screen flex items-center justify-center px-4">
    <main class="text-center animate-fadeIn max-w-md mx-auto">
      <!-- Icon -->
      <div class="mb-8">
        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto">
          <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
        </div>
      </div>

      <!-- Main Message -->
      <div class="mb-8">
        <h1 class="text-4xl font-light text-slate-800 mb-4">Page Not Found</h1>
        <p class="text-slate-500 text-sm leading-relaxed">
          Sorry, the page you are looking for does not exist or has been moved
        </p>
      </div>

      <!-- Current URL -->
      <div class="mb-8">
        <div class="bg-slate-50 rounded-lg p-4 border border-slate-200">
          <p class="text-xs text-slate-500 mb-2">Current URL:</p>
          <p class="text-sm text-slate-700 font-mono break-all" id="currentUrl"></p>
        </div>
      </div>

      <!-- Action Hint -->
      <div class="text-slate-400 text-xs mb-2">Please check the URL or return to homepage</div>
      <div class="text-slate-500 text-xs" id="countdown">Redirecting to homepage in 5 seconds</div>
    </main>

    <script>
      // Display current URL without params
      document.getElementById('currentUrl').textContent = window.location.origin + window.location.pathname

      // Countdown timer
      let countdown = 5
      const countdownElement = document.getElementById('countdown')

      const timer = setInterval(() => {
        countdown--
        if (countdown > 0) {
          countdownElement.textContent = `Redirecting to homepage in ${countdown} seconds`
        } else {
          countdownElement.textContent = 'Redirecting...'
          clearInterval(timer)
        }
      }, 1000)
    </script>
  </body>
</html>
