<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简单页面 - 404</title>
    <meta name="description" content="一个简单的、无任何意义的页面" />
  </head>
  <body>
    <div class="simple-page">
      <div class="container">
        <h1 class="title">简单页面</h1>
        <p class="subtitle">这是一个简单的、无任何意义的页面</p>

        <div class="content-grid">
          <div class="card">
            <h3>卡片 1</h3>
            <p>这里有一些随机的内容，没有任何特殊意义。</p>
          </div>

          <div class="card">
            <h3>卡片 2</h3>
            <p>更多随机内容，纯粹为了填充空间。</p>
          </div>

          <div class="card">
            <h3>卡片 3</h3>
            <p>最后一个卡片，同样没有实际用途。</p>
          </div>
        </div>

        <div class="random-section">
          <h2>随机信息</h2>
          <ul class="random-list">
            <li>项目创建时间：2024年</li>
            <li>技术栈：Astro + TypeScript</li>
            <li>页面类型：静态页面</li>
            <li>用途：演示和测试</li>
          </ul>
        </div>

        <div class="footer-note">
          <p>这个页面没有任何实际功能，仅用于展示。</p>
        </div>
      </div>
    </div>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        line-height: 1.6;
      }

      .simple-page {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 2rem 0;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 1rem;
      }

      .title {
        font-size: 3rem;
        font-weight: bold;
        color: white;
        text-align: center;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .subtitle {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.9);
        text-align: center;
        margin-bottom: 3rem;
      }

      .content-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 2rem;
        margin-bottom: 3rem;
      }

      .card {
        background: rgba(255, 255, 255, 0.95);
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      }

      .card h3 {
        color: #333;
        margin-bottom: 1rem;
        font-size: 1.3rem;
      }

      .card p {
        color: #666;
        line-height: 1.6;
      }

      .random-section {
        background: rgba(255, 255, 255, 0.1);
        padding: 2rem;
        border-radius: 12px;
        margin-bottom: 2rem;
        backdrop-filter: blur(10px);
      }

      .random-section h2 {
        color: white;
        margin-bottom: 1.5rem;
        text-align: center;
      }

      .random-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .random-list li {
        color: rgba(255, 255, 255, 0.9);
        padding: 0.5rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        font-size: 1.1rem;
      }

      .random-list li:last-child {
        border-bottom: none;
      }

      .footer-note {
        text-align: center;
        color: rgba(255, 255, 255, 0.8);
        font-style: italic;
      }

      @media (max-width: 768px) {
        .title {
          font-size: 2rem;
        }

        .content-grid {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }

        .card {
          padding: 1.5rem;
        }
      }
    </style>
  </body>
</html>
