<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <meta name="description" content="" />
  </head>
  <body>
    <div class="welcome-container">
      <div class="background-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="circle circle-4"></div>
        <div class="circle circle-5"></div>
      </div>

      <div class="center-shapes">
        <div class="main-shape">
          <div class="shape-inner"></div>
        </div>
        <div class="orbit-ring ring-1">
          <div class="orbit-dot"></div>
        </div>
        <div class="orbit-ring ring-2">
          <div class="orbit-dot"></div>
        </div>
        <div class="orbit-ring ring-3">
          <div class="orbit-dot"></div>
        </div>
      </div>

      <div class="geometric-shapes">
        <div class="triangle"></div>
        <div class="square"></div>
        <div class="hexagon"></div>
        <div class="diamond"></div>
      </div>

      <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
      </div>

      <div class="light-effects">
        <div class="light-beam beam-1"></div>
        <div class="light-beam beam-2"></div>
        <div class="light-beam beam-3"></div>
      </div>

      <div class="like-button-container">
        <a class="like-button" id="likeBtn" href="https://www.youtube.com/watch?v=DvzboEBcHpk">
          <div class="play-icon">
            <div class="play-triangle"></div>
          </div>
          <div class="like-text">LIKE</div>
        </a>
      </div>
    </div>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow: hidden;
        background: #000;
      }

      a {
        text-decoration: none;
        color: #fff;
      }
      .welcome-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 背景动画圆圈 */
      .background-circles {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
      }

      .circle {
        position: absolute;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.1);
        animation: float 6s ease-in-out infinite;
      }

      .circle-1 {
        width: 200px;
        height: 200px;
        top: 10%;
        left: 10%;
        animation-delay: 0s;
      }

      .circle-2 {
        width: 150px;
        height: 150px;
        top: 20%;
        right: 15%;
        animation-delay: 1s;
      }

      .circle-3 {
        width: 100px;
        height: 100px;
        bottom: 20%;
        left: 20%;
        animation-delay: 2s;
      }

      .circle-4 {
        width: 80px;
        height: 80px;
        bottom: 30%;
        right: 25%;
        animation-delay: 3s;
      }

      .circle-5 {
        width: 120px;
        height: 120px;
        top: 50%;
        left: 5%;
        animation-delay: 4s;
      }

      /* 中心图形 */
      .center-shapes {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .main-shape {
        width: 100px;
        height: 100px;
        background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
        border-radius: 50%;
        position: relative;
        animation: pulse 2s ease-in-out infinite;
        box-shadow: 0 0 50px rgba(255, 107, 107, 0.5);
      }

      .shape-inner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        animation: rotate 3s linear infinite;
      }

      .orbit-ring {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        animation: rotate 10s linear infinite;
      }

      .ring-1 {
        width: 200px;
        height: 200px;
        animation-duration: 8s;
      }

      .ring-2 {
        width: 250px;
        height: 250px;
        animation-duration: 12s;
        animation-direction: reverse;
      }

      .ring-3 {
        width: 300px;
        height: 300px;
        animation-duration: 15s;
      }

      .orbit-dot {
        position: absolute;
        width: 8px;
        height: 8px;
        background: #4ecdc4;
        border-radius: 50%;
        top: -4px;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 10px #4ecdc4;
      }

      /* 装饰性几何图形 */
      .geometric-shapes {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
      }

      .triangle {
        position: absolute;
        top: 15%;
        right: 20%;
        width: 0;
        height: 0;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 43px solid rgba(255, 107, 107, 0.3);
        animation: bounce 2s ease-in-out infinite;
      }

      .square {
        position: absolute;
        top: 70%;
        left: 10%;
        width: 40px;
        height: 40px;
        background: rgba(78, 205, 196, 0.3);
        transform: rotate(45deg);
        animation: rotate 4s linear infinite;
      }

      .hexagon {
        position: absolute;
        top: 25%;
        left: 5%;
        width: 30px;
        height: 30px;
        background: rgba(69, 183, 209, 0.3);
        transform: rotate(30deg);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        animation: scale 3s ease-in-out infinite;
      }

      .diamond {
        position: absolute;
        bottom: 15%;
        right: 10%;
        width: 35px;
        height: 35px;
        background: rgba(150, 206, 180, 0.3);
        transform: rotate(45deg);
        animation: float 4s ease-in-out infinite;
      }

      /* 粒子效果 */
      .particles {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
      }

      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #fff;
        border-radius: 50%;
        animation: particle-float 6s linear infinite;
      }

      .particle:nth-child(1) {
        top: 20%;
        left: 20%;
        animation-delay: 0s;
      }

      .particle:nth-child(2) {
        top: 30%;
        right: 25%;
        animation-delay: 1s;
      }

      .particle:nth-child(3) {
        bottom: 30%;
        left: 30%;
        animation-delay: 2s;
      }

      .particle:nth-child(4) {
        bottom: 20%;
        right: 20%;
        animation-delay: 3s;
      }

      .particle:nth-child(5) {
        top: 50%;
        left: 10%;
        animation-delay: 4s;
      }

      .particle:nth-child(6) {
        top: 60%;
        right: 15%;
        animation-delay: 5s;
      }

      .particle:nth-child(7) {
        top: 40%;
        left: 80%;
        animation-delay: 1.5s;
      }

      .particle:nth-child(8) {
        bottom: 40%;
        right: 30%;
        animation-delay: 2.5s;
      }

      /* 光效 */
      .light-effects {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
      }

      .light-beam {
        position: absolute;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        height: 2px;
        animation: light-sweep 4s ease-in-out infinite;
      }

      .beam-1 {
        top: 30%;
        width: 100%;
        animation-delay: 0s;
      }

      .beam-2 {
        top: 60%;
        width: 100%;
        animation-delay: 2s;
      }

      .beam-3 {
        top: 45%;
        width: 100%;
        animation-delay: 4s;
      }

      /* 动画定义 */
      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(180deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      @keyframes scale {
        0%,
        100% {
          transform: scale(1) rotate(30deg);
        }
        50% {
          transform: scale(1.2) rotate(30deg);
        }
      }

      @keyframes particle-float {
        0% {
          transform: translateY(0px) translateX(0px);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100px) translateX(50px);
          opacity: 0;
        }
      }

      @keyframes light-sweep {
        0% {
          transform: translateX(-100%);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateX(100%);
          opacity: 0;
        }
      }

      /* LIKE 按钮样式 */
      .like-button-container {
        position: absolute;
        bottom: 50px;
        right: 50px;
        display: flex;
        align-items: center;
      }

      .like-button {
        background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
        border: none;
        border-radius: 50px;
        padding: 15px 25px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .like-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(255, 107, 107, 0.4);
        background: linear-gradient(45deg, #ff5252, #ff7979);
      }

      .like-button:active {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(255, 107, 107, 0.3);
      }

      .like-button:hover {
        background: linear-gradient(45deg, #ff5252, #ff7979);
        animation: like-pulse 0.6s ease-out;
      }

      .play-icon {
        position: relative;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .play-triangle {
        width: 0;
        height: 0;
        border-left: 12px solid white;
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        margin-left: 2px;
      }

      .like-text {
        color: white;
        font-weight: bold;
        font-size: 14px;
        letter-spacing: 1px;
      }

      /* 按钮动画 */
      @keyframes like-pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      /* 响应式设计 */
      @media (max-width: 768px) {
        .center-shapes {
          width: 250px;
          height: 250px;
        }

        .main-shape {
          width: 80px;
          height: 80px;
        }

        .shape-inner {
          width: 50px;
          height: 50px;
        }

        .ring-1 {
          width: 150px;
          height: 150px;
        }

        .ring-2 {
          width: 200px;
          height: 200px;
        }

        .ring-3 {
          width: 250px;
          height: 250px;
        }

        .like-button-container {
          bottom: 30px;
          right: 30px;
        }

        .like-button {
          padding: 12px 20px;
        }

        .like-text {
          font-size: 12px;
        }
      }
    </style>
  </body>
</html>
