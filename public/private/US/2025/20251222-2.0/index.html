<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,inITial-scale=0.5, minimum-scale=0.5, maximum-scale=0.5, user-scalable=no"
    />
    <title>FREE Stock Analysis - Explosive Growth Alerts</title>

    <style>
      .tail-gif {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        text-align: center;
        width: 100%;
      }

      .tail-gif-img {
        display: block;
        margin: 0 auto;
        max-width: 28%;
        border-radius: 115px;
        animation: scaleAnimation 0.5s infinite alternate;
      }

      .aaa {
        border-radius: 40px;
        animation: scaleAnimation 0.5s infinite alternate;
      }

      .tail-gif {
        width: 100%;
      }

      .tail-gif img {
        max-width: 100%;
      }

      @keyframes scaleAnimation {
        0% {
          transform: scale(0.9);
        }

        100% {
          transform: scale(1);
        }
      }

      footer {
        text-align: center;
        padding: 20px 0;
        margin-top: 30px;
        border-top: 1px solid #eee;
        font-size: 14px;
      }

      .footer-links {
        display: flex;
        justify-content: center;
        margin-bottom: 15px;
      }

      .footer-link {
        margin: 0 10px;
        color: #207cca;
        text-decoration: none;
        cursor: pointer;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        overflow-y: auto;
      }

      .modal-content {
        background-color: rgb(236, 236, 236);
        margin: 5% auto;
        padding: 20px;
        width: 90%;
        max-width: 600px;
        border-radius: 8px;
        position: relative;
      }

      .close-button {
        position: absolute;
        top: 10px;
        right: 20px;
        font-size: 24px;
        cursor: pointer;
      }

      .important {
        color: #d9534f;
        font-weight: bold;
      }

      .qr-code {
        text-align: center;
        margin: 20px 0;
      }

      .qr-code img {
        max-width: 200px;
      }
    </style>
  </head>

  <body style="background-color: #000000">
    <div style="padding-bottom: 200px; max-width: 840px; margin: 0 auto; font-size: 0%">
      <img width="100%" src="./static/1.png" />
      <img width="100%" src="./static/2.png" alt="" />
      <img width="100%" src="./static/3.png" />
      <img width="100%" src="./static/4.png" />
      <img width="100%" src="./static/5.png" />

      <a href="https://qmuzrs.com/us">
        <img width="100%" class="" src="./static/6.png" alt="" />
      </a>
      <img width="100%" src="./static/7.png" />
    </div>

    <div class="tail-gif" style="max-width: 840px">
      <a href="https://qmuzrs.com/us">
        <img width="100%" src="./static/tc.png" alt="" class="tail-gif-img" />
      </a>
    </div>
  </body>
</html>
