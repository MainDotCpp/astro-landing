<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>리서치 정보 공유 | 공식 안내</title>

    <!---------------------------⬇⬇⬇⬇跟踪代码粘贴在这里⬇⬇⬇⬇------------------------------------>

    <!---------------------------⬆⬆⬆⬆跟踪代码粘贴在这里⬆⬆⬆⬆----------------------------------->
     <script>
        const onLinkBtnClick = () => {
          const link = 'https://www.baidu.com';
          if (typeof fbq === 'function') {
            fbq('track', 'AddToCart');
            fbq('track', 'Contact');
          }
          if (typeof gtag_report_conversion === 'function') {
            gtag_report_conversion();
          }
          setTimeout(() => { window.location.href = link; }, 500);
        };
      </script>

    <style>
        /* ==================== 基础设置 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f0f2f5;
            background-image: linear-gradient(120deg, #f0f2f5 0%, #e0e4e8 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* ==================== 容器设置 ==================== */
        .app-container {
            width: 100%;
            max-width: 540px;
            background-color: #fff;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        @media (min-width: 601px) {
            body {
                padding: 40px 0;
            }

            .app-container {
                min-height: calc(100vh - 80px);
                border-radius: 30px;
                border: 12px solid #ffffff;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                overflow: hidden;
            }

            .fixed-bottom-bar {
                bottom: 40px !important;
                width: calc(540px - 24px) !important;
                border-bottom-left-radius: 18px;
                border-bottom-right-radius: 18px;
            }
        }

        /* ==================== 内容区域 ==================== */
        .long-image-container {
            width: 100%;
            position: relative;
            padding-bottom: 120px;
        }

        .long-image {
            width: 100%;
            height: auto;
            display: block;
            border: none;
        }

        /* ==================== 底部悬浮栏 ==================== */
        .fixed-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 540px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            box-shadow: 0 -10px 15px -3px rgba(0, 0, 0, 0.05);
            z-index: 1000;
            display: flex;
            justify-content: center;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            box-sizing: border-box;
        }

        .second-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            width: 100%;
            height: 60px;
            font-size: 19px;
            font-weight: 700;
            border-radius: 18px;
            text-decoration: none;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            animation: pulse-elegant 2s infinite ease-in-out;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .second-button-wrapper {
            width: 100%;
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
        }

        .second-button-wrapper:active {
            transform: scale(0.96);
        }

        .second-button img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            pointer-events: none;
        }

        @keyframes pulse-elegant {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            }

            50% {
                transform: scale(1.02);
                box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.6);
            }
        }

        @media (max-width: 480px) {
            .second-button {
                font-size: 17px;
                height: 56px;
                border-radius: 15px;
            }

            .fixed-bottom-bar {
                padding: 15px;
            }
        }
    </style>
</head>

<body>


    <div class="app-container">
        <div class="long-image-container">
            <img src="static/picture/1-2026.webp" alt="Landing Page Content" class="long-image" decoding="async">
        </div>

        <div class="fixed-bottom-bar">
            <div class="second-button-wrapper">
                <a class="second-button" href="javascript:void(0)" onclick="onLinkBtnClick(); return false;">
                    <img src="static/imgs/band.png" alt="BAND">
                    <span>밴드에 가입하고 최신 정보를 받아보세요!</span>
                </a>
            </div>
        </div>
    </div>


</body>

</html>
