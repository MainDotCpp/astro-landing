<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#FFC72C"/>
      <stop offset="65%" stop-color="#E69E00"/>
      <stop offset="100%" stop-color="#8C5A00"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8C5A00"/>
      <stop offset="50%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#8C5A00"/>
    </linearGradient>
    <radialGradient id="bowl" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0%" stop-color="#FFF1B8"/>
      <stop offset="40%" stop-color="#FFC72C"/>
      <stop offset="100%" stop-color="#7A4F00"/>
    </radialGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD24A"/>
      <stop offset="100%" stop-color="#B07200"/>
    </linearGradient>
  </defs>
  <!-- Base plinth -->
  <rect x="80" y="430" width="160" height="34" rx="3" fill="url(#goldGrad)"/>
  <rect x="80" y="430" width="160" height="6" fill="url(#goldRim)"/>
  <rect x="92" y="416" width="136" height="18" rx="2" fill="url(#goldGrad)"/>
  <!-- Stem -->
  <path d="M120 416 L132 360 L188 360 L200 416 Z" fill="url(#goldGrad)"/>
  <ellipse cx="160" cy="360" rx="40" ry="10" fill="url(#goldRim)"/>
  <!-- Twisted columns (stylized handles) -->
  <path d="M120 360 C 70 320, 70 250, 120 220" stroke="url(#goldGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M200 360 C 250 320, 250 250, 200 220" stroke="url(#goldGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Bowl / globe holder -->
  <path d="M100 230 C 100 130, 220 130, 220 230 L 200 260 L 120 260 Z" fill="url(#bowl)"/>
  <ellipse cx="160" cy="230" rx="60" ry="14" fill="url(#goldRim)" opacity="0.85"/>
  <!-- Globe -->
  <circle cx="160" cy="120" r="86" fill="url(#globe)"/>
  <!-- Globe meridians -->
  <ellipse cx="160" cy="120" rx="86" ry="30" stroke="#7A4F00" stroke-width="2" fill="none" opacity="0.6"/>
  <ellipse cx="160" cy="120" rx="40" ry="86" stroke="#7A4F00" stroke-width="2" fill="none" opacity="0.4"/>
  <ellipse cx="160" cy="120" rx="20" ry="86" stroke="#7A4F00" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M74 120 Q160 70 246 120" stroke="#7A4F00" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Highlight -->
  <ellipse cx="130" cy="85" rx="20" ry="10" fill="#FFF7D6" opacity="0.6"/>
  <ellipse cx="135" cy="180" rx="14" ry="36" fill="#FFE082" opacity="0.35"/>
</svg>
