<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="주요 산업군 종목 선별 및 투자 핵심 정보 제공" />
    <title>주요 산업군 종목 선별</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
        overflow-x: hidden;
      }

      body {
        background-image: url('https://images.unsplash.com/photo-1621264448270-9ef00e88a935?q=80&w=657&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        position: relative;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 0;
      }

      .container {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        text-align: center;
      }

      .content {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.95) 100%);
        border-radius: 24px;
        padding: 45px 35px;
        max-width: 500px;
        width: 100%;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        position: relative;
        overflow: hidden;
      }

      .content::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #667eea 100%);
        background-size: 200% 100%;
        animation: shimmer 3s ease-in-out infinite;
      }

      @keyframes shimmer {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      h1 {
        font-size: 26px;
        font-weight: 700;
        color: #1a1a1a;
        line-height: 1.5;
        margin-bottom: 24px;
        letter-spacing: -0.5px;
      }

      .description {
        font-size: 18px;
        color: #2d3748;
        line-height: 1.8;
        margin-bottom: 18px;
        font-weight: 500;
      }

      .sub-description {
        font-size: 16px;
        color: #4a5568;
        line-height: 1.8;
        margin-bottom: 40px;
      }

      .more-btn {
        display: inline-block;
        width: 100%;
        max-width: 300px;
        padding: 18px 30px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        font-size: 18px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        animation: breathe 2.5s ease-in-out infinite;
      }

      .more-btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition:
          width 0.6s,
          height 0.6s;
      }

      .more-btn:hover::before {
        width: 300px;
        height: 300px;
      }

      @keyframes breathe {
        0%,
        100% {
          box-shadow:
            0 4px 20px rgba(102, 126, 234, 0.5),
            0 0 0 0 rgba(102, 126, 234, 0.4);
        }
        50% {
          box-shadow:
            0 4px 30px rgba(102, 126, 234, 0.7),
            0 0 0 10px rgba(102, 126, 234, 0);
        }
      }

      .more-btn:hover {
        transform: translateY(-2px);
        animation: none;
        box-shadow:
          0 6px 25px rgba(102, 126, 234, 0.7),
          0 0 0 0 rgba(102, 126, 234, 0);
      }

      .more-btn:active {
        transform: translateY(0);
      }

      @media screen and (max-width: 480px) {
        .content {
          padding: 35px 25px;
          border-radius: 20px;
        }

        h1 {
          font-size: 20px;
          margin-bottom: 18px;
        }

        .description {
          font-size: 16px;
          margin-bottom: 12px;
        }

        .sub-description {
          font-size: 14px;
          margin-bottom: 35px;
        }

        .more-btn {
          font-size: 16px;
          padding: 16px 25px;
        }
      }

      @media screen and (max-width: 360px) {
        h1 {
          font-size: 18px;
        }

        .description {
          font-size: 15px;
        }

        .sub-description {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1>최근 변동성이 큰 시장 속에서도</h1>
        <p class="description">꾸준히 관심을 받고 있는 주요 산업군 종목을 선별했습니다.</p>
        <p class="sub-description">투자 전 꼭 체크해야 할 핵심 정보만 모았습니다.</p>
        <a href="/b" class="more-btn">더 보기</a>
      </div>
    </div>
  </body>
</html>
